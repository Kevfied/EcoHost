[package]
name = "ecohost"
version = "0.1.2"
description = "EcoHost — Minecraft server management tool"
authors = ["you"]
edition = "2021"

[lib]
name = "ecohost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
hex = "0.4"
minisign-verify = "0.3.0"
semver = "1.0.28"
fs2 = "0.4.3"
dirs = "6"
tauri-plugin-single-instance = { version = "2.5.5", default-features = false }

[dev-dependencies]
tiny_http = "0.12.0"
minisign = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"

# Faster release rebuilds — binary is ~4MB anyway, incremental is a clear win.
[profile.release]
incremental = true
